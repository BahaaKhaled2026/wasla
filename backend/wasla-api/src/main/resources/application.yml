spring:
  application:
    name: wasla-api
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration

wasla:
  datasource:
    control:
      jdbc-url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_CONTROL_DB:wasla_control}"
      username: "${POSTGRES_USER:wasla}"
      password: "${POSTGRES_PASSWORD:wasla_local_only}"
      pool-name: "control-pool"
      maximum-pool-size: 10
    tenant:
      jdbc-url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TENANT_DB:wasla_tenant}"
      username: "${POSTGRES_USER:wasla}"
      password: "${POSTGRES_PASSWORD:wasla_local_only}"
      pool-name: "tenant-pool"
      maximum-pool-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
